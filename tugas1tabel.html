<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Tabel Luas Perkebunan</title>
</head>
<body>

    <p><b>Tabel Luas Perkebunan</b></p>

    <table border="1" cellpadding="5">
        <tr>
            <th>Jenis Perkebunan</th>
            <th colspan="4">Luas Tanah</th>
        </tr>
        
        <tr>
            <td bgcolor="brown">Kopi</td>
            <td bgcolor="blue">21 Hektar</td>
            <td bgcolor="blue">36 Hektar</td>
            <td bgcolor="blue">45 Hektar</td>
            <td bgcolor="blue">54 Hektar</td>
        </tr>
        
        <tr>
            <td bgcolor="green">Kelapa Sawit</td>
            <td bgcolor="blue">30 Hektar</td>
            <td bgcolor="blue">27 Hektar</td>
            <td bgcolor="blue">31 Hektar</td>
            <td bgcolor="blue">20 Hektar</td>
        </tr>
        
        <tr>
            <th>Total Produksi</th>
            <th colspan="2">Besaran Panen Bulanan</th>
            <th colspan="2">Besaran Panen Tahunan</th>
        </tr>
        
        <tr>
            <td bgcolor="yellow">Kelapa Sawit</td>
            <td colspan="2" align="center" bgcolor="blue">200 Ton</td>
            <td colspan="2" align="center" bgcolor="blue">450 Ton</td>
        </tr>
    </table>

</body>
</html>
