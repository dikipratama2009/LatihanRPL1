<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Membuat Unordered List</title>
</head>
<body>
    <h1>Daftar Mata Pelajaran</h1>
    <ul>
        <li>Matematika</li>
        <li>IPA</li>
        <li>IPS</li>
        <li>sejarah</li>
    </ul>
    
    <h1>Daftar Mata Pelajaran</h1>
    <ul type="circle">
        <li>Matematika</li>
        <li>IPA</li>
        <li>IPS</li>
        <li>sejarah</li>
    </ul>

    <h1>Daftar Mata Pelajaran</h1>
    <ul type="square">
        <li>Matematika</li>
        <li>IPA</li>
        <li>IPS</li>
        <li>sejarah</li>
    </ul>
</body>
</html>
