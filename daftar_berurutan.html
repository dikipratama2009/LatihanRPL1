<!DOCTYPE html>

<head>

    <title>Membuat Ordered List</title>
</head>
<body>
    <h1>Daftar Mata Pelajaran</h1>
    <ol type="1">
        <li>Matematika</li>
        <li>IPA</li>
        <li>IPS</li>
        <li>sejarah</li>
    </ol>
    
    <h1>Daftar Mata Pelajaran</h1>
    <ol type="A">
        <li>Matematika</li>
        <li>IPA</li>
        <li>IPS</li>
        <li>sejarah</li>
    </ol>

    <h1>Daftar Mata Pelajaran</h1>
    <ol type="I">
        <li>Matematika</li>
        <li>IPA</li>
        <li>IPS</li>
        <li>sejarah</li>
    </ol>
</body>
</html>
